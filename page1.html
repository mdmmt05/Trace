<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRACE LIGHTING</title>

<style>
:root{
  --bg:#0B0F13;
  --card:#131A21;
  --card2:#0F151C;
  --border:#2A3138;
  --text:#E0E5EC;
  --text-dim:#7F8C99;
  --accent:#4FA3FF;
}

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--text);
}

/* HEADER */
.header{
  padding:16px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--border);
}
.title{
  font-weight:600;
  letter-spacing:2px;
  font-size:1rem;
}
.status{
  width:8px;height:8px;
  border-radius:50%;
  background:var(--accent);
}

/* CARD */
.card{
  margin:16px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
}
.card-header{
  padding:14px 18px;
  background:var(--card2);
  border-bottom:1px solid var(--border);
  font-size:0.8rem;
  letter-spacing:1px;
  color:var(--text-dim);
}
.card-body{
  padding:18px;
}

/* COLOR PREVIEW */
.preview{
  height:70px;
  border-radius:12px;
  margin-bottom:18px;
  border:1px solid var(--border);
  background:#fff;
}

/* PICKER */
.picker{
  width:100%;
  aspect-ratio:1/0.6;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:12px;
}
#canvas{width:100%;height:100%;}
.cursor{
  position:absolute;
  width:18px;height:18px;
  border-radius:50%;
  border:2px solid #fff;
  transform:translate(-50%,-50%);
}

/* INPUTS */
.row{display:flex;gap:10px;}
.input{
  flex:1;
}
.input input{
  width:100%;
  background:#0F151C;
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px;
  text-align:center;
  color:var(--text);
}

/* BUTTON */
.btn{
  width:100%;
  margin-top:12px;
  padding:14px;
  border-radius:40px;
  border:1px solid var(--accent);
  color:var(--accent);
  background:transparent;
  font-weight:600;
}

/* MODES */
.mode{
  padding:12px;
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:8px;
}
.mode.active{
  border-color:var(--accent);
}

/* ADVANCED */
details{
  margin-top:10px;
}
summary{
  color:var(--text-dim);
  font-size:0.8rem;
}

/* FOOTER */
.footer{
  margin:30px 0;
  text-align:center;
  font-size:0.7rem;
  color:var(--text-dim);
}

/* MONOGRAM */
.monogram{
  margin-top:10px;
  opacity:0.4;
}
.monogram svg{
  width:28px;
  height:28px;
}
</style>
</head>

<body>

<div class="header">
  <div class="title">TRACE LIGHTING</div>
  <div class="status"></div>
</div>

<!-- COLORE -->
<div class="card">
<div class="card-header">Colore</div>
<div class="card-body">

<div class="preview" id="preview"></div>

<div class="picker">
<canvas id="canvas"></canvas>
</div>

<div class="row">
<div class="input"><input id="r" type="number" min="0" max="255"></div>
<div class="input"><input id="g" type="number" min="0" max="255"></div>
<div class="input"><input id="b" type="number" min="0" max="255"></div>
</div>

<button class="btn" id="applyColor">Applica colore</button>

</div>
</div>

<!-- MODALITÀ -->
<div class="card">
<div class="card-header">Modalità</div>
<div class="card-body">

<div class="mode" data-mode="STATIC">Statico</div>
<div class="mode" data-mode="FADING">Fading</div>
<div class="mode" data-mode="BREATHING">Respiro</div>
<div class="mode" data-mode="RPM_COLOR">RPM colore</div>
<div class="mode" data-mode="RPM_WARNING">Avviso RPM</div>

</div>
</div>

<!-- AVANZATE -->
<div class="card">
<div class="card-header">Impostazioni</div>
<div class="card-body">

<details>
<summary>Parametri avanzati</summary>

<input id="speed" type="range" min="0" max="100">
<input id="brightness" type="range" min="0" max="100">

<input id="rpmT" type="number" placeholder="Soglia RPM">
<input id="rpmM" type="number" placeholder="RPM max">

<button class="btn" id="applyParams">Applica</button>

</details>

</div>
</div>

<div class="footer">

<script>
// minimale per ESP32
async function post(url,data){
  try{
    await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(data)
    });
  }catch(e){}
}

document.getElementById('applyColor').onclick=()=>{
  post('/api/color',{
    r:+r.value,g:+g.value,b:+b.value
  });
};

document.querySelectorAll('.mode').forEach(el=>{
  el.onclick=()=>{
    post('/api/mode',{mode:el.dataset.mode});
  };
});

document.getElementById('applyParams').onclick=()=>{
  post('/api/params',{
    speed:+speed.value,
    brightness:+brightness.value,
    rpmThreshold:+rpmT.value,
    rpmMax:+rpmM.value
  });
};
</script>
